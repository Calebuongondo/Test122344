<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-Pesa Checkout</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#15221c;background:#f3f6f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(100%,420px);background:white;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(17,45,30,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.mark{width:42px;height:42px;border-radius:13px;background:#14a86b;color:white;display:grid;place-items:center;font-size:22px;font-weight:800}
.brand h1{font-size:18px;margin:0}
.brand p{margin:3px 0 0;color:#718079;font-size:13px}
h2{font-size:24px;margin:0 0 8px}
.subtitle{color:#69776f;font-size:14px;margin:0 0 24px}
label{font-size:13px;font-weight:650;display:block;margin:16px 0 8px}
input{width:100%;border:1px solid #dce5df;border-radius:11px;padding:14px;font:inherit;outline:none}
input:focus{border-color:#13a568;box-shadow:0 0 0 3px rgba(19,165,104,.12)}
.amount{position:relative}
.amount span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#718079;font-size:14px}
.amount input{padding-left:56px}
button{width:100%;margin-top:22px;border:0;border-radius:11px;padding:15px;background:#129e62;color:white;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.note{font-size:12px;color:#7c8982;text-align:center;margin:15px 0 0}
.status{display:none;margin-top:16px;padding:13px;border-radius:11px;background:#f1f7f3;font-size:14px;line-height:1.45;white-space:pre-line}
.status.show{display:block}
.status.error{background:#fff2f0;color:#a4382d}
.status.success{background:#edf9f1;color:#147543}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark">M</div><div><h1>M-Pesa Checkout</h1><p>Secure mobile payment</p></div></div>
  <h2>Pay securely</h2>
  <p class="subtitle">Enter your details to receive an M-Pesa payment prompt.</p>
  <form id="checkout">
    <label for="amount">Amount</label>
    <div class="amount"><span>KES</span><input id="amount" name="amount" type="number" inputmode="numeric" min="1" max="150000" step="1" placeholder="0" required></div>
    <label for="phone">M-Pesa phone number</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="tel" required>
    <button id="pay" type="submit">Pay with M-Pesa</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <p class="note">Payment is confirmed only after Safaricom sends a result.</p>
</main>
<script>
const form=document.getElementById("checkout"),button=document.getElementById("pay"),statusBox=document.getElementById("status");
function show(text,type=""){statusBox.className="status show "+type;statusBox.textContent=text}
form.addEventListener("submit",async e=>{
 e.preventDefault();button.disabled=true;button.textContent="Sending request…";show("Sending payment request. Please wait.");
 try{
  const res=await fetch("/api/pay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:document.getElementById("amount").value,phone:document.getElementById("phone").value})});
  const data=await res.json();if(!res.ok)throw new Error(data.error||"Could not start payment.");
  show(data.message||"STK prompt sent. Check your phone.");
  const id=data.checkoutRequestId;let finished=false;
  for(let i=0;i<36;i++){
   await new Promise(r=>setTimeout(r,5000));
   const check=await fetch("/api/payment/"+encodeURIComponent(id));const result=await check.json();
   if(result.status==="paid"){show("Payment successful!"+(result.receipt?"\nReceipt: "+result.receipt:""),"success");finished=true;break}
   if(result.status==="failed"){show(result.resultDescription||"Payment failed or was cancelled.","error");finished=true;break}
  }
  if(!finished)show("Still awaiting confirmation. Check your M-Pesa messages; this payment may take longer. Don't pay again until you confirm its status.");
 }catch(err){show(err.message,"error")}
 finally{button.disabled=false;button.textContent="Pay with M-Pesa"}
});
</script>
</body>
</html>
